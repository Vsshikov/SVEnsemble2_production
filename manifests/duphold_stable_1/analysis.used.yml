# Core env for developing and running svensemble.
#   micromamba create -f environment.yml
#   micromamba run -n svensemble2-dev pip install --no-deps -e .
# Releases install non-editable (no -e) and record exact versions as lock files.
name: svensemble2-dev
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.14
  - pip
  - numpy
  - pandas<3
  - scikit-learn
  - py-xgboost=*=cpu_*
  - pysam
  - cyvcf2
  - python-igraph
  - pyyaml
  - frozendict  # built in from Python 3.15 (PEP 814)
  - shap=*=cpu_*
  - pytest
---
# Packages added on top of svensemble2/environment.yml for <group>/env-analysis/.
# Built only with --analysis (new-experiment, refresh-experiment, make-release).
# Kept here, not in svensemble2, so editing it never changes a svensemble2 commit
# (which would rename the apptainer image and rerun svensemble tasks).
name: svensemble2-analysis
channels:
  - conda-forge
  - bioconda
dependencies:
  - matplotlib>=3.8
  - seaborn>=0.13
  - adjusttext>=1.0
  - scipy
  - statsmodels
  - tqdm
  - ipykernel
  - ipywidgets
