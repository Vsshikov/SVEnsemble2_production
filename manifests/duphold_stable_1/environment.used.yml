# Core env for developing and running svensemble.
#   micromamba create -f environment.yml
#   micromamba run -n svensemble2-dev pip install --no-deps -e .
# Releases install non-editable (no -e) and record exact versions as lock files.
name: svensemble2-dev
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.14
  - pip
  - numpy
  - pandas<3
  - scikit-learn
  - py-xgboost=*=cpu_*
  - pysam
  - cyvcf2
  - python-igraph
  - pyyaml
  - frozendict  # built in from Python 3.15 (PEP 814)
  - shap=*=cpu_*
  - pytest
